name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.3.0"
        required: true

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 0.3.0, got $VERSION"
            exit 1
          fi

      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # Keep the token so the release commit and tag can be pushed.
          persist-credentials: true
          # Full history so the notes can list commits since the last tag.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0)
          {
            git log --format="- %s" "$previous..HEAD"
            echo
            echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Set the version
        run: |
          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" \
            custom_components/otodata_ble/manifest.json
          uv version --no-sync "$VERSION"
          git diff

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

      - name: Create the release
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
