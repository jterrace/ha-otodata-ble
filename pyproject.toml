[project]
name = "ha-otodata-ble"
version = "0.1.0"
description = "Home Assistant integration for Otodata propane tank monitors over Bluetooth LE"
requires-python = ">=3.14.2"

[dependency-groups]
lint = [
    "ruff==0.15.21",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "colorlog==6.10.1",
    # Keep in sync with the homeassistant key in hacs.json.
    "homeassistant==2026.6.4",
]

[tool.uv]
# Not an installable package; uv only manages the dev environment.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
