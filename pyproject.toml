[project]
name = "ha-otodata-ble"
version = "0.3.0"
description = "Home Assistant integration for Otodata propane tank monitors over Bluetooth LE"
requires-python = ">=3.14.2"

[dependency-groups]
lint = [
    "ruff==0.15.21",
]
test = [
    # Pins pytest, pytest-cov and homeassistant (2026.6.4). The homeassistant
    # version must match the homeassistant key in hacs.json.
    "pytest-homeassistant-custom-component==0.13.340",
    # Requirements of that homeassistant version's bluetooth and usb components,
    # plus aioesphomeapi, which serialx imports. HA installs these at runtime;
    # tests need them to load bluetooth.
    "aioesphomeapi==45.3.1",
    "aiousbwatcher==1.1.2",
    "bleak==3.0.2",
    "bleak-retry-connector==4.6.1",
    "bluetooth-adapters==2.3.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.18",
    "dbus-fast==5.0.16",
    "habluetooth==6.8.1",
    "serialx==1.8.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "colorlog==6.10.1",
]

[tool.uv]
# Not an installable package; uv only manages the dev environment.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
